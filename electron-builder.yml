# Instaladores: npm run dist (gera em dist/ para o sistema atual).
# macOS: assina (Developer ID) e notariza so quando ha credenciais no ambiente (CSC_LINK/CSC_NAME,
# APPLE_API_KEY*); sem elas gera o app sem assinatura, como antes. Windows e Linux: sem assinatura.
# Detalhes em build/macos-signing.md.
appId: com.brothernog.orbita
productName: Orbita
directories:
  output: dist
files:
  - out/**
  - resources/icon.png
  - package.json
# Skills lidas em runtime por process.resourcesPath/skills (index.ts: setSkillRoots).
extraResources:
  - from: resources/skills
    to: skills
icon: resources/icon.png
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableCookieEncryption: true
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  # Trocar os fuses invalida a assinatura do linker; sem reassinar (ad-hoc) o app nao abre no Apple Silicon
  # quando nao ha identidade. Com Developer ID a assinatura real vem depois e substitui esta.
  resetAdHocDarwinSignature: true
win:
  target: nsis
  # .ico pronto: o conversor PNG->ICO do electron-builder falha (WebAssembly.Memory) neste ambiente
  icon: resources/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  # Um dmg por arquitetura em vez de universal: cada download fica com metade do tamanho.
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.developer-tools
  # Exigido pela notarizacao. So vale com identidade; sem ela o app fica so com a assinatura ad-hoc.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Roda depois da assinatura se APPLE_API_KEY/APPLE_API_KEY_ID/APPLE_API_ISSUER (ou APPLE_ID...) existirem;
  # sem elas o electron-builder so avisa e segue.
  notarize: true
dmg:
  # Sem isto o dmg x64 sai sem sufixo de arquitetura.
  artifactName: ${productName}-${version}-${arch}.${ext}
linux:
  target: [AppImage, deb]
  category: Development
  maintainer: brothernog
